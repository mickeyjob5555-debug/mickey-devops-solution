replicaCount: 2

image:
  repository: api-service
  tag: sandbox
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 3000

# MongoDB connection settings for the sandbox.
# The sandbox runs MongoDB without auth, so there is no password in the URI.
# The URI must include replicaSet=rs0 and the correct namespace (data).
mongo:
  db: api_service
  uri: "mongodb://mongodb-0.mongodb.data.svc.cluster.local:27017/api_service?replicaSet=rs0"
  # Placeholder for the unused Secret template. In production, the password
  # would come from an external secret and MONGO_URI would be built at deploy time.
  password: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

pdb:
  enabled: true
  minAvailable: 1

nodeSelector: {}
