apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

helmGlobals:
  chartHome: ../../../helm-charts

helmCharts:
  - name: api-service
    releaseName: api-service
    namespace: apps
    valuesInline:
      image:
        repository: api-service
        tag: sandbox
        pullPolicy: IfNotPresent
